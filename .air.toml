root = "."
tmp_dir = "tmp"
build_delay = 1500 

[build]
cmd = "go build -o ./tmp/main.exe ."
bin = "tmp/main.exe"
full_bin = "./tmp/main.exe"
include_ext = ["go", "html", "tpl"]
exclude_dir = ["tmp", "vendor"]
kill_delay = "1s" 

[log]
time = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"